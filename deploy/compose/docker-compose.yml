# Componente B: API + PostgreSQL en una instancia de 1 GiB.
# Uso (desde la raíz del repo): docker compose -f deploy/compose/docker-compose.yml up -d --build
name: voltrix-alertas

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: voltrix-alertas:latest
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-voltrix}:${POSTGRES_PASSWORD:-voltrix}@db:5432/${POSTGRES_DB:-alertas}
      TELEMETRIA_URL: ${TELEMETRIA_URL:-}
      WORKERS: ${WORKERS:-4}
      MAX_CONCURRENCIA: ${MAX_CONCURRENCIA:-16}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 384m
    restart: unless-stopped
    networks: [voltrix]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voltrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltrix}
      POSTGRES_DB: ${POSTGRES_DB:-alertas}
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=20
      - -c
      - work_mem=2MB
    # Sin "ports": solo la API la alcanza, por la red interna.
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    restart: unless-stopped
    networks: [voltrix]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

networks:
  voltrix:
    name: voltrix-alertas

volumes:
  pgdata:
