apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertas-api
  namespace: voltrix-alertas
  labels:
    app.kubernetes.io/name: alertas-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: alertas-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertas-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Imagen construida con el Dockerfile del repo e importada al nodo (ver README).
          image: voltrix-alertas:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: alertas-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: alertas-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Tolerante: si la base de datos cae, /health da 503 y la réplica sale del Service,
          # pero no se reinicia en bucle mientras la base de datos vuelve.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
