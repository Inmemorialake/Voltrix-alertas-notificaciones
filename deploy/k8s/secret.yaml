# Secret DE EJEMPLO para la demostración en Floci. No use estos valores fuera de un entorno local.
apiVersion: v1
kind: Secret
metadata:
  name: alertas-db
  namespace: voltrix-alertas
type: Opaque
stringData:
  POSTGRES_USER: voltrix
  POSTGRES_PASSWORD: ejemplo-cambiar
  POSTGRES_DB: alertas
  DATABASE_URL: postgresql://voltrix:ejemplo-cambiar@db:5432/alertas
